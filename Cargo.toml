[package]
name = "chwazi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Private, browser-side multi-touch finger chooser in Rust"

[lib]
name = "chwazi"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only the browser needs entropy, and only to pick the winner. On the host the
# chooser is driven by unit tests with an explicit index, so `getrandom` is a
# wasm-only dependency and is never compiled into a native build.
getrandom = { version = "0.3", features = ["wasm_js"] }
# A caret, not an exact pin: `wasm-bindgen-futures`, `js-sys` and `web-sys`
# each depend on one exact `wasm-bindgen`, so `Cargo.lock` decides the version
# whichever way this line is written, and an exact pin here would only be a
# second copy of it to keep in step. The bindings generator must be that same
# version -- a mismatch fails at load time in the browser, not at compile time
# -- and the workflows read the version from the lock rather than naming it.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  # The finger chooser needs none of the form controls the other apps do: its
  # entire interface is one canvas and the pointer events a phone sends it.
  "Window", "Document", "Element", "Event", "EventTarget",
  "Node", "NodeList", "HtmlElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasWindingRule", "Path2d",
  "PointerEvent", "TouchEvent", "DomRect", "DomPoint", "Text",
  "Performance", "EventListenerOptions", "console",
  "Navigator", "ServiceWorkerContainer", "ServiceWorkerRegistration",
  "ServiceWorker", "ServiceWorkerState", "RegistrationOptions", "Location", "Url",
] }

[build-dependencies]
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
serde_json = "1"

[lints.rust]
warnings = "deny"

[profile.release]
strip = true
lto = true
opt-level = "s"
