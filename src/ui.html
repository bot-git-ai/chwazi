<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The original's viewport: a finger chooser is a pass-the-phone-around game,
     so pinch-zoom must not be reachable by a stray second finger. -->
<meta name="viewport" content="width=device-width, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Put two or more fingers on the screen and Chwazi picks one at random.">
<title>Chwazi Finger Chooser</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
/* The original's stylesheet, kept as it was: one black surface, no scroll, no
   browser gestures fighting the fingers that are the whole point.
   `touch-action` is the belt to `touchmove`'s braces -- a browser that honours
   it never scrolls or pinch-zooms in the first place. */
html, body, canvas { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; touch-action: none; }
body { color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
/* Off screen, but not `display: none`: the state of the draw is announced to a
   screen reader and invisible to everyone else, which keeps the author's black
   canvas exactly as black as it was. */
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }

/* The splash. It is here so that the moment before the app starts looks like a
   decision rather than an empty screen, which is what a black page reads as.
   The committed icon, breathing on the same 1500ms as the app's own circles, so
   the splash and the app are visibly the same thing. Rust removes this element
   on its first frame -- so the splash is never behind the canvas for a single
   frame of interaction, and cannot swallow a touch. */
#splash {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  background: #000; pointer-events: none;
}
#splash img { width: clamp(64px, 17vmin, 132px); height: auto; opacity: .78; filter: invert(1); animation: breathe 1500ms ease-in-out infinite; }
#splash span { font-size: 15px; letter-spacing: .01em; color: #9aa0a6; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .62 } 50% { transform: scale(1.06); opacity: .86 } }
@media (prefers-reduced-motion: reduce) { #splash img { animation: none } }

/* Only ever visible when the app failed to start, so it cannot cost the app a
   pixel of the screen it is trying to fill. */
#error { box-sizing: border-box; position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; padding: 24px; background: #000; color: #fff; font-size: 15px; line-height: 1.5; text-align: center; }
#error strong { font-size: 17px; }
#error span { color: #9aa0a6; font-size: 13px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<!-- One canvas, filling the window. Rust sizes it from the window on load and
     on every resize, and draws every frame into it; the page holds no other
     visible content at all. -->
<canvas id="main" role="img" aria-label="Coloured circles, one per finger touching the screen. A wheel of those colours spins and settles on one finger, whose colour then fills the screen."></canvas>
<!-- The splash. Removed by Rust on its first frame, so it is never in the way. -->
<div id="splash">
  <img src="./icon.svg" alt="" width="132" height="132">
  <span>Put two or more fingers on the screen</span>
</div>
<!-- The draw's state, for anyone who cannot see the canvas. -->
<p id="status" class="visually-hidden" role="status" aria-live="polite">Loading Chwazi&hellip;</p>
<div id="error" role="alert" hidden>
  <strong>Chwazi could not start.</strong>
  <span>Chwazi could not start. Reload the page, or check your connection.</span>
</div>
<noscript><div id="nojs"><style>#error { display: flex; }</style><strong>Chwazi could not start.</strong><span>Put two or more fingers on the screen and it picks one at random.</span></div></noscript>
<script type="module">
// The whole script. It loads the app, takes the splash down once the app has
// started, and says so plainly if it could not.
const fail = () => {
  document.getElementById('splash').hidden = true;
  document.getElementById('status').textContent = 'Chwazi could not start.';
  document.getElementById('error').hidden = false;
  document.getElementById('error').lastElementChild.textContent = 'Chwazi could not start. Reload the page, or check your connection.';
};
import('./app.js').then(m => m.default()).catch(fail);
// Belt and braces: if the bindings load but the start function does not run --
// the one case where the promise resolves and nothing happens -- the splash would
// sit there forever. Rust takes it down itself, and this covers it not doing so.
setTimeout(() => { const s = document.getElementById('splash'); if (s && !s.hidden && document.getElementById('error').hidden) s.remove(); }, 4000);
</script>
</body>
</html>
